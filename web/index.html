<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 제목 앨리먼트 -->
    <h1> 제목 </h1>
    <!-- 내용 앨리먼트 -->
    <p> 내용 </p>
    <!-- 링크이동 앨리먼트 -->
    <a href="https://naver.com">네이버로 이동</a>

    <!-- 부모 앨리먼트 -->
    <div>
        <!-- 자식 앨리먼트 -->
        <h2 id="sub1" class="sub1"> 123 </h2>
        <p>qwe</p>
        <h2 id="sub2" class="sub1 sub2">asd</h2>
        <p>zxc</p>
    </div>
    <!-- 
    HTML
    - 태그라는 것으로 구성
    - 태그는 여는 태그, 닫는 태그로 구성됨
        - 여는 태그 : <태그이름>, 닫는태그 : </태그이름>
        - 예외적으로 혼자쓰는 태그 존재
    - 태그 세트 -> 앨리먼트
     -->
    <!-- 
    석택자/검색 하는 법
    
    태그(태그 이름으로 검색)
        - 이름 : 동명이인이 가능함
    class(. 으로 검색)
        - 별명(여러명이 같은 별명을 가질 수 있고 한 명이 여러개의 별명을 가질 수 있다.)
    ID(# 욿 검색)
        - html내에서 같은 id를 쓸 수 없음
    -->
    <style>
        h1{
            color:aqua;
            font-size:  60px;
        }
    </style>
</body>
</html>
